  RFC 8414 authorization-server metadata and RFC 9728 protected-resource
  metadata as genuine JSON documents. Those two justify the WellKnown pointer.
  EVERYTHING ELSE IS A FALSE POSITIVE AND IS RECORDED AS A MISS. Both
  doc.kotzilla.io (Docusaurus) and console.kotzilla.io (SPA behind nginx) answer
  HTTP 200 with `text/html` for EVERY /.well-known/* path probed, including
  paths that cannot exist — they are catch-all shells, not documents. They are
  listed below with `soft_200_html: true` and `document: false` so no later pass
  mistakes them for served surfaces. No security.txt is served anywhere on
