note: >-
  Two published tiers. Kotzilla publishes a real free tier with a stated event
  quota, and an Enterprise tier gated behind "Custom Pricing" with no public
  number. No machine-readable pricing/catalog endpoint exists, so this is read
  from the human pricing page.
currency_note: >-
  No currency is stated for the paid tier because no paid price is published.
  The student/teacher offer is the only figure carrying a currency symbol
  ("Free 0€"), which places list pricing in EUR — Kotzilla SAS is a French
  company.

