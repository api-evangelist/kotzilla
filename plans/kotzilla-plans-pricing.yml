summary:
  plan_count: 2
  free_tier: true
  public_paid_price: false
  sales_gate: true
  sales_gate_note: >-
    Every tier above the free Starter plan is priced by contact only, so the
    real cost of production use is not publicly discoverable. Notably the free
    tier's data region is fixed to the USA — EU data residency is an Enterprise
    (i.e. sales-gated) feature for a French vendor.
