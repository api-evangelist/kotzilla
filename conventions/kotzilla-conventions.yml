  authentication: authentication/kotzilla-authentication.yml
  scopes: scopes/kotzilla-scopes.yml
  lifecycle: lifecycle/kotzilla-lifecycle.yml
  rate_limits: rate-limits/kotzilla-rate-limits.yml
  mcp: mcp/kotzilla-mcp.yml
  conformance: conformance/kotzilla-conformance.yml
