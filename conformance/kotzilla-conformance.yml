  - id: soc2
    name: SOC 2
    conforms: false
    evidence: No SOC 2 claim found on the website, docs, privacy policy or any trust page; no trust center exists (trust.kotzilla.io does not resolve).
  - id: iso27001
    name: ISO/IEC 27001
    conforms: false
    evidence: No ISO 27001 claim found on any Kotzilla public surface.

summary:
  conforms_count: 9
  standards_checked: 19
  posture: >-
    Kotzilla's standards posture is concentrated entirely in the agent layer.
    The MCP server is a textbook implementation of the current MCP
    authorization stack — RFC 8414 + RFC 9728 discovery, PKCE S256, dynamic
    client registration and token revocation, all served anonymously. Outside
    that, there is no HTTP API contract of any kind, and no third-party
    security certification.
