generated: '2026-08-17'
method: searched
source: https://doc.kotzilla.io/docs/releaseNotes/versionUpgrades
note: >-
  Kotzilla's lifecycle posture is SDK-shaped, not API-shaped: version policy,
  deprecation and support windows are all expressed as Maven artifact versions
  and Kotlin/AGP compatibility ranges, because there is no versioned HTTP API.
  NO STATUS PAGE EXISTS — see status_page below, which records a false positive
  that was checked and rejected.

versioning:
  scheme: semver
  current: 2.3.3
  current_date: '2026-08-03'
  docs: https://doc.kotzilla.io/docs/releaseNotes/versionUpgrades
  quote: >-
    "2.3.0 is a drop-in upgrade from 2.2.x. Bump the version, rebuild, and
    everything keeps working."
  breaking_change_policy: >-
    Breaking changes are flagged on major/minor bumps; the version-upgrades
    guide exists "to help you migrate between major SDK updates that might
    require to go over some breaking changes".
  api_versioning: null
  api_versioning_note: No HTTP API is published, so there is no URI/header/date API version scheme.

deprecation:
  policy_url: https://doc.kotzilla.io/docs/releaseNotes/versionUpgrades
  published: true
  model: gradual-deprecation
  quote: >-
    Deprecated APIs are marked but remain functional across a minor bump — for
    the 2.1.x to 2.2.x transition, "They still work; migrate to generated
    monitoring()".
  caveat: >-
    "If you build with allWarningsAsErrors, these deprecations become hard
    errors." — the soft deprecation becomes a hard build failure for strict
    projects.
  sunset_header: false
  sunset_header_note: RFC 8594 Sunset/Deprecation headers are not applicable; there is no HTTP API surface.
  explicit_eol_dates: false
  explicit_eol_note: >-
    The docs express support as tested compatibility ranges (SDK 2.3.0 supports
    "Kotlin 2.2.0 - 2.4.x", "2.5+ accepted with a warning") rather than
    calendar end-of-life dates for SDK versions.

