generated: '2026-08-17'
method: searched
status: published
source: https://doc.kotzilla.io/docs/getstartedCustom/mcpSetup
docs:
  - https://doc.kotzilla.io/docs/discover/mcpServer
  - https://doc.kotzilla.io/docs/getstartedCustom/mcpSetup
note: >-
  The Kotzilla MCP Server is this provider's ONLY machine-readable API surface.
  Kotzilla publishes no REST OpenAPI and no GraphQL endpoint — there is no
  api.kotzilla.io (NXDOMAIN), and /openapi.json, /swagger.json, /v3/api-docs and
  /graphql on both console.kotzilla.io and doc.kotzilla.io return HTML app
  shells, not specs. The "SDK features & API" docs section documents a Kotlin
  SDK API (KotzillaSDK.log/trace/setUserId/...), not an HTTP API. So for
  Kotzilla, MCP is the API.

deployment:
  mode: remote
  endpoint: https://mcp.kotzilla.io/mcp
  auth: oauth
  verified: probed
  note: >-
    REMOTE, not a package. Kotzilla's setup docs show `npx -y mcp-remote
    https://mcp.kotzilla.io/mcp`, but mcp-remote is the third-party stdio<->HTTP
    bridge for clients that cannot speak remote MCP — it is NOT a Kotzilla
    package and Kotzilla ships no npm/PyPI MCP package of its own. The product
    an agent actually calls is the hosted HTTPS endpoint, so mode is `remote`.

server:
  name: kotzilla
  transport: http
  url: https://mcp.kotzilla.io/mcp
  resource_name: Kotzilla MCP Server
  clients_documented: [Claude Code, Cursor, Windsurf, Android Studio]

authentication:
  type: oauth2
  flow: authorization_code
  pkce: S256
  dynamic_client_registration: true
  authorization_endpoint: https://mcp.kotzilla.io/oauth/authorize
  token_endpoint: https://mcp.kotzilla.io/oauth/token
  registration_endpoint: https://mcp.kotzilla.io/oauth/register
  revocation_endpoint: https://mcp.kotzilla.io/oauth/revoke
  scopes: [openid, email, offline_access]
  metadata:
    - well-known/kotzilla-oauth-authorization-server.json
    - well-known/kotzilla-oauth-protected-resource.json
  docs_quote: >-
    "On first use, the MCP Server asks you to authenticate with your Kotzilla
    account. If you do not have an account yet, you can create one for free at
    console.kotzilla.io."

client_config:
  source: https://doc.kotzilla.io/docs/getstartedCustom/mcpSetup
  verbatim: |
    {
      "mcpServers": {
        "kotzilla": {
          "command": "npx",
          "args": ["-y", "mcp-remote", "https://mcp.kotzilla.io/mcp"]
        }
      }
    }

