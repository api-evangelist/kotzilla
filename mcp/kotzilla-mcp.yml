    category: telemetry
  - name: get_issues
    description: Performance and architecture issues
    category: issues
  - name: get_issue_context
    description: Deep dive analysis with dependency trees
    category: issues
  - name: get_fix_guidance
    description: Fix patterns for issue types
    category: issues
  - name: generate_report
