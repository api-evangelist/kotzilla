summary:
  tool_count: 15
  tools_with_input_schema: 0
  input_schemas_gated: true
  write_tools: [create_app, set_app_versions_enabled, koin_apply_fix]
  note: >-
    Three of the fifteen tools mutate state (register an app, toggle per-version
    data ingestion, apply a Koin configuration fix to source). koin_apply_fix in
    particular writes to the developer's codebase, which is the highest-
    consequence operation in this tool set.
