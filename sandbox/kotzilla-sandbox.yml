generated: '2026-08-17'
method: searched
source: https://doc.kotzilla.io/docs/getstartedNIA/setup
docs:
  - https://doc.kotzilla.io/docs/getstartedNIA/overview
  - https://doc.kotzilla.io/docs/getstartedNIA/setup
  - https://doc.kotzilla.io/docs/getstartedNIA/validationIssues
note: >-
  Kotzilla's "sandbox" is a try-before-you-instrument path built on a forked
  open-source sample app, NOT a test-vs-live key separation. There are no test
  API keys, no test/live modes and no magic test identifiers — an evaluator
  registers a real (free) app in the real Console and points a sample Android
  application at it. Every value below is published by Kotzilla verbatim; none
  is invented.

model:
  test_live_separation: false
  test_key_prefix: null
  live_key_prefix: null
  note: >-
    Kotzilla issues one API key per registered application via kotzilla.json.
    The docs describe no separate test-mode credential, so evaluation data and
    production data are separated by APPLICATION, not by key mode. The
    per-version ingestion switch (`set_app_versions_enabled` MCP tool /
    https://doc.kotzilla.io/docs/settings/... version controls) is the closest
    thing to an environment gate.

console:
  url: https://console.kotzilla.io/
  sandbox_home: https://console.kotzilla.io/sandbox-home
  signup: https://console.kotzilla.io/signup
  free_account_required: true
  note: >-
    console.kotzilla.io/sandbox-home returns 200 and is linked from the
    kotzilla.io homepage as the sandbox entry point. The page itself is behind
    the console SPA; contents were not enumerated anonymously.

demo_app:
  name: NowInAndroid
  upstream: https://github.com/android/nowinandroid
  kotzilla_fork: https://github.com/kotzilla-io/nowinandroid
  kotzilla_fork_annotations: https://github.com/kotzilla-io/nowinandroid_koin_annotations
  license: Apache-2.0
  registration_values_published:
    application_name: NowInAndroid-gettingStarted
    android_package_name: com.google.samples.apps.nowinandroid.demo.debug
  note: >-
    These are the exact values Kotzilla's getting-started guide tells an
    evaluator to enter when registering the demo app in the Console. They are
    the only published fixture values in Kotzilla's documentation.

setup_paths:
  - name: MCP-driven setup
    description: >-
      Prompt an AI assistant connected to the Kotzilla MCP server with a setup
      command; the server registers the project and configures the SDK via the
      create_app / generate_app_config / guide_sdk_installation tools.
    entry: https://mcp.kotzilla.io/mcp
  - name: IDE plugin setup
    description: >-
      Open NowInAndroid in Android Studio, use the Koin IDE Plugin's "Kotzilla
      Flight Check" tab, click "Manual Setup" to reach the Console, register
      the app with the published values above, then apply the generated
      kotzilla.json and Gradle changes.
    entry: https://plugins.jetbrains.com/plugin/26131

