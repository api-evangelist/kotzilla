aid: kotzilla
name: Kotzilla
description: >-
  Kotzilla is a French developer-observability company based in Toulouse,
  founded by the creators of Koin — the open-source dependency-injection
  framework for Kotlin, which Kotzilla still maintains. The Kotzilla Platform
  monitors Android and Kotlin Multiplatform applications by using Koin's
  containerization to map runtime telemetry onto application architecture,
  detecting slow startups, ANRs, crashes, background work and slow rendering,
  then tracing each issue back to the dependency graph that caused it. The
  platform has four components: the Koin IDE plugin for IntelliJ and Android
  Studio, the Kotzilla SDK distributed through Maven Central, the Kotzilla
  Console, and a hosted remote MCP server that connects AI coding assistants to
  the platform. Kotzilla publishes no REST or GraphQL API — the MCP server, with
  fifteen tools behind OAuth 2.0 with PKCE and dynamic client registration, is
  its only machine-readable, agent-callable surface.
