apis:
- name: Kotzilla MCP Server
  description: >-
    Hosted remote Model Context Protocol server that connects an AI coding
    assistant to the Kotzilla Platform. Fifteen tools covering app registration,
    SDK onboarding, telemetry, issue detection and context, fix guidance,
    reporting, per-version ingestion control, and Koin dependency-graph
    diagnosis and repair. Protected by OAuth 2.0 authorization-code with PKCE
    S256, dynamic client registration and refresh tokens; an unauthenticated
    tools/list returns HTTP 401 invalid_token. This is the only callable API
    Kotzilla publishes.
