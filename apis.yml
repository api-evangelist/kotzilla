x-artifact-notes:
  no_openapi: >-
    No OpenAPI, Swagger or GraphQL contract is published. /openapi.json,
    /openapi.yaml, /swagger.json, /v1/openapi.json, /v3/api-docs, /api-docs and
    /redoc were probed on kotzilla.io, doc.kotzilla.io, console.kotzilla.io and
    mcp.kotzilla.io on 2026-08-17; doc and console return HTML app shells
    (soft 200s) for every path, the rest 404, and api.kotzilla.io does not
    resolve. POST /graphql on console.kotzilla.io returns nginx 405. The
    documentation section titled "SDK features & API" documents a Kotlin
    in-process API, not an HTTP API.
  no_agent_card: >-
    No A2A agent card. /.well-known/agent-card.json and /.well-known/agent.json
    return 404 on mcp.kotzilla.io and kotzilla.io; doc and console return HTML
    shells, which are not cards. Nothing was written to a2a/ — this artifact is
    search-only and is never authored on a provider's behalf.
  no_status_page: >-
    No status page. status.kotzilla.io does not resolve. kotzilla.statuspage.io
    returns HTTP 200 but redirects to atlassian.com/software/statuspage, the
    Atlassian marketing site — a false positive that was checked and rejected,
    so no StatusPage pointer is emitted.
  no_security_program: >-
    No security.txt on any host, no vulnerability-disclosure or bug-bounty
    program, and no trust center (trust.kotzilla.io does not resolve). No SOC 2
    or ISO 27001 claim appears on any public Kotzilla surface, so no Security,
    SecurityTxt, VulnerabilityDisclosure, TrustCenter or Compliance pointer is
    emitted. Kotzilla does publish a GDPR posture with a real retention
    schedule in its privacy policy; that is recorded in
    conformance/kotzilla-conformance.yml rather than claimed as a certification.
  no_idempotency: >-
    No idempotency key or retry-safety contract is documented, and MCP defines
    none. Three of the fifteen MCP tools mutate state (create_app,
    set_app_versions_enabled, koin_apply_fix, the last of which writes to the
    developer's source) with no published dedupe mechanism, so no Idempotency
    pointer is emitted.
  no_event_surface: >-
    No AsyncAPI and no webhooks. Telemetry flows one way from the instrumented
    application into the platform; there is no outbound customer event surface,
    so the asyncapi scoring family is not applicable rather than failed.
  no_skills_or_crosswalk: >-
    skills/ and mcp/kotzilla-tool-crosswalk.yml were deliberately not written.
    Both require an OpenAPI to ground operationIds against, and Kotzilla has
    none. Authoring either would have meant inventing operations.
  package_currency: >-
    Maven versions were read from repo1.maven.org maven-metadata.xml, not from
    search.maven.org's solr index, which is stale for this org and still
    reports io.kotzilla:kotzilla-sdk at 1.1.0 (2025-05-16) against a real
    current release of 2.3.3 (2026-08-03).
